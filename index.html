<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hành Trình Sự Nghiệp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
/* UI: bảng giấy kem viền nâu, nút xanh ngọc, huy hiệu tròn — theo phong cách game mobile pixel */
:root{
  --sky:#cfe6ee; --sky2:#e9f3ea;
  --paper:#fbf0da; --paper2:#f3e1bd; --paper3:#e8cf9f;
  --brown:#7a4b2a; --brown-d:#4a2a16; --ink:#4b2e1b; --muted:#8b6a4b;
  --blue:#5fa8e0; --blue-d:#2f6fae; --blue-l:#dff0fb;
  --green:#5cc79d; --green-d:#2b8f6a; --gold:#f4b73e; --gold-d:#b87a14; --red:#e2574c;
  --font-display:'Chakra Petch','Be Vietnam Pro',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme: light;
}
[hidden]{display:none !important}
*{-webkit-tap-highlight-color:transparent}
body{
  background:linear-gradient(var(--sky),var(--sky2)) fixed; color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;
  padding-block:18px;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:960px; margin:0 auto; display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
.stats{flex-wrap:wrap}
/* khung giấy dùng chung */
.panel,.badge,.dialog,.stats span,.chapters button,.cs-stats div,.cs-facts,.lb-note{
  background:var(--paper); border:3px solid var(--brown); border-radius:10px; box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d);
}
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px}
h1{font:700 clamp(20px,4.6vw,30px)/1.15 var(--font-display); margin:0; text-wrap:balance; color:var(--brown-d); text-shadow:0 2px 0 #fff8}
.sub{margin:2px 0 0; color:var(--muted); font-size:13px}
.stats{display:flex; gap:8px; font:700 12px var(--font-display); letter-spacing:.04em}
.stats span{display:flex; align-items:center; gap:7px; padding:3px 12px 3px 4px; border-radius:999px; color:var(--brown)}
.stats span::before{content:""; width:22px; height:22px; border-radius:50%; background:var(--gold); border:2px solid var(--gold-d); box-shadow:inset 0 -3px 0 #e39a1c, inset 0 2px 0 #ffe29a}
.stats span:nth-child(2)::before{background:var(--blue); border-color:var(--blue-d); box-shadow:inset 0 -3px 0 #3c85c8, inset 0 2px 0 #b9ddf7}
.stats b{color:var(--blue-d); font-variant-numeric:tabular-nums; font-size:14px}

.stagewrap{position:relative; border:4px solid var(--brown); border-radius:12px; overflow:hidden; box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--brown), 0 9px 0 6px var(--brown-d); background:#000; container-type:inline-size; margin:6px 6px 12px}
canvas{display:block; width:100%; height:auto; aspect-ratio:16/9; image-rendering:crisp-edges; image-rendering:pixelated}

/* biển tên khu vực: dải xanh như tab tiêu đề trong game */
.badge{position:absolute; left:10px; top:10px; display:flex; flex-direction:column; gap:2px; padding:5px 12px 6px 10px; max-width:72%; border-radius:8px; border-left-width:8px; border-left-color:var(--blue)}
.badge b{font:700 clamp(12px,2.5cqw,17px)/1.2 var(--font-display); color:var(--brown-d)}
.badge span{font:600 clamp(10px,1.8cqw,13px) var(--font-display); color:var(--blue-d); letter-spacing:.03em}

/* nút tương tác nổi: bong bóng kem, phím E là nút xanh ngọc */
.prompt{position:absolute; top:52%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; font:700 clamp(11px,2.1cqw,14px) var(--font-display);
  background:var(--paper); color:var(--brown-d); border:3px solid var(--brown); border-radius:999px; padding:3px 14px 3px 4px; box-shadow:0 3px 0 var(--brown-d); cursor:pointer; white-space:nowrap}
.prompt::after{content:""; position:absolute; left:50%; bottom:-9px; width:10px; height:10px; background:var(--paper); border:3px solid var(--brown); border-top:0; border-left:0; transform:translateX(-50%) rotate(45deg); margin-top:-5px}
.prompt kbd{font:700 1em var(--font-display); display:grid; place-items:center; min-width:1.9em; height:1.9em; border-radius:50%; background:var(--green); color:#fff; border:2px solid var(--green-d); box-shadow:inset 0 -3px 0 var(--green-d); margin:0}
.prompt:active{transform:translateX(-50%) translateY(2px)}

.stagewrap.talking .badge{display:none}
.dialog{position:absolute; left:50%; right:auto; transform:translateX(-50%); width:min(70%,620px); top:auto; bottom:37%; max-height:60%; overflow:auto; cursor:pointer; padding:13px 12px 4px; font-size:clamp(11px,1.8cqw,14.5px); line-height:1.38; color:var(--ink); border-radius:12px}
.who{position:absolute; left:12px; top:-3px; transform:translateY(-50%); font:700 .8em var(--font-display); color:#fff; background:var(--blue); border:3px solid var(--blue-d); border-radius:999px; padding:0 12px; letter-spacing:.04em; box-shadow:0 2px 0 var(--blue-d)}
.dialog{overflow:visible; max-height:none}
.txt{min-height:1.4em; padding-right:78px}
.chips{display:flex; flex-direction:column; gap:5px; margin:8px 0 0; padding:0; list-style:none}
.chips li{padding:5px 10px; background:var(--blue-l); border:2px solid #a9cde8; border-radius:8px; font-size:.92em; color:var(--brown-d)}
.next{position:absolute; right:12px; bottom:4px; color:var(--blue-d); font:700 .75em var(--font-display); letter-spacing:.06em; line-height:1.2}
@container (max-width:520px){ .txt{padding-right:28px} .dialog{width:calc(100% - 20px); padding-bottom:17px; font-size:11.5px} }
.chips:not([hidden])~.next{position:static; display:block; text-align:right; margin-top:2px}

.intro{position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:12px; text-align:center; padding:16px;
  background:linear-gradient(rgba(207,230,238,.35), rgba(251,240,218,.82))}
.intro h2{margin:0; font:700 clamp(20px,6cqw,42px)/1.1 var(--font-display); text-wrap:balance; color:var(--brown-d); text-shadow:0 2px 0 #fff9}
.intro p{margin:0; max-width:44ch; color:var(--ink); font-size:clamp(12px,2.1cqw,16px); line-height:1.5; background:var(--paper); border:3px solid var(--brown); border-radius:10px; padding:10px 14px; box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d)}
.btn{font:700 clamp(13px,2.4cqw,17px) var(--font-display); letter-spacing:.04em; background:var(--green); color:#fff; text-shadow:0 2px 0 var(--green-d);
  border:3px solid var(--green-d); border-radius:999px; padding:9px 26px; box-shadow:inset 0 3px 0 #9be6c7, 0 4px 0 var(--green-d); cursor:pointer}
.btn:active{transform:translateY(3px); box-shadow:inset 0 3px 0 #9be6c7, 0 1px 0 var(--green-d)}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}


/* ===== điện thoại (màn dọc): gọn, to, dễ bấm ===== */
.btn2{display:none; background:var(--paper); color:var(--brown-d); text-shadow:none; border:3px solid var(--brown); box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d)}
@media (pointer:coarse) and (max-aspect-ratio:1/1){ .btn2{display:inline-block} #startBtn{order:2} .btn2{order:1} .intro .btn{font-size:14px; padding:10px 16px} #startFs{background:var(--green); color:#fff; text-shadow:0 2px 0 var(--green-d); border-color:var(--green-d); box-shadow:inset 0 3px 0 #9be6c7, 0 4px 0 var(--green-d)} #startBtn{background:var(--paper); color:var(--brown-d); text-shadow:none; border:3px solid var(--brown); box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d)} }
@media (max-width:600px){
  body{padding-block:8px; padding-left:max(8px, env(safe-area-inset-left,0px)); padding-right:max(8px, env(safe-area-inset-right,0px))}
  .wrap{gap:8px}
  h1{font-size:19px}
  .sub{font-size:11.5px; line-height:1.3}
  .top{gap:6px}
  .stats{flex-wrap:nowrap; gap:5px; width:100%; font-size:11px; letter-spacing:0}
  .stats span,.stats .bdgBtn{padding:3px 9px 3px 3px; gap:5px; white-space:nowrap}
  .stats span::before,.stats .bdgBtn::before{display:none}
  .stats span,.stats .bdgBtn{padding:4px 10px; flex:1 1 auto; justify-content:center}
  .stats b{font-size:12px}
  .stats .iconbtn{flex:0 0 auto; width:28px; height:28px; font-size:14px}
  .stagewrap{margin:2px -4px 10px; border-width:3px; border-radius:10px}
  .intro h2{display:none}
  .intro p{font-size:12px; padding:8px 10px}
  .stagewrap:has(#intro:not([hidden])) .badge{display:none}
  .chapters{padding:2px 2px 8px}
  .stagewrap:has(#intro:not([hidden])) #fsBtn{display:none}
}
@media (max-width:340px){ .stats{flex-wrap:wrap} }
@media (max-width:380px){ .stats{font-size:10px; gap:4px} .stats span,.stats .bdgBtn{padding:4px 6px} .stats b{font-size:11px} .stats .iconbtn{width:26px; height:26px} }
/* thanh chặng: tab giấy kem, chặng hiện tại màu xanh */
.chapters{display:flex; gap:8px; overflow-x:auto; padding:4px 6px 10px; scrollbar-width:thin}
.chapters button{flex:0 0 auto; display:flex; align-items:center; gap:6px; font:700 12px var(--font-display); color:var(--brown-d); border-radius:999px; padding:3px 12px 3px 4px; cursor:pointer; white-space:nowrap}
.chapters button.cur{background:var(--blue); border-color:var(--blue-d); color:#fff; box-shadow:inset 0 2px 0 #b9ddf7, 0 3px 0 var(--blue-d)}
.chapters button.done::after{content:"✓"; color:var(--green-d); font-weight:700}
.chapters button.cur.done::after{color:#d9ffee}
.chapters .n{display:grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--paper3); color:var(--brown-d); font-size:11px; margin:0; font-variant-numeric:tabular-nums}
.chapters button.cur .n{background:#fff; color:var(--blue-d)}

/* nút đóng / điều hướng */
.lb-x,.lb-nav{font:700 clamp(11px,1.9cqw,14px) var(--font-display); color:#fff; background:var(--red); text-shadow:0 2px 0 #a8342b; border:3px solid #a8342b; border-radius:999px; padding:4px 14px; box-shadow:inset 0 2px 0 #f39289, 0 3px 0 #a8342b; cursor:pointer}
.lb-x:active,.lb-nav:active{transform:translateY(2px)}
.lb{position:absolute; inset:0; display:grid; grid-template-rows:auto 1fr auto; gap:8px; padding:10px 12px; background:rgba(74,42,22,.94); z-index:3}
.lb-top{display:flex; justify-content:space-between; align-items:center; gap:10px; font:700 clamp(11px,1.9cqw,14px) var(--font-display); letter-spacing:.04em; color:var(--paper)}
.lb-main{min-height:0; display:grid; grid-template-rows:minmax(0,1fr); grid-template-columns:auto 1fr auto; align-items:center; gap:8px}
.lb-nav{width:clamp(34px,6cqw,46px); height:clamp(40px,9cqw,56px); padding:0; font-size:18px; background:var(--blue); border-color:var(--blue-d); text-shadow:0 2px 0 var(--blue-d); box-shadow:inset 0 2px 0 #b9ddf7, 0 3px 0 var(--blue-d)}
.lb-nav:disabled{opacity:.35; cursor:default}
.lb-frame{position:relative; min-height:0; height:100%; display:grid; place-items:center}
.lb-frame img{position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%; object-fit:contain; border:4px solid var(--paper); border-radius:6px; background:#fff; box-shadow:0 0 0 3px var(--brown); image-rendering:auto}
.lb-note div{margin-top:6px; text-align:left}
.lb-note{max-width:60ch; padding:16px; text-align:center; font-size:clamp(13px,2.4cqw,18px)}
.lb-cap{text-align:center; font-size:clamp(11px,1.9cqw,15px); line-height:1.4; color:var(--paper)}
.lb-cap small{display:block; color:var(--paper3); margin-top:2px; font-size:.85em}

/* phòng triển lãm / trang dự án: giấy kem, tiêu đề nâu */
.cs{position:absolute; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr); background:var(--paper); z-index:2}
.cs-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 12px; background:var(--blue); border-bottom:3px solid var(--blue-d); font:700 clamp(11px,1.9cqw,14px) var(--font-display); letter-spacing:.04em; color:#fff; text-shadow:0 2px 0 var(--blue-d)}
.cs-body{overflow:auto; padding:clamp(12px,3cqw,28px); font-size:clamp(12px,1.9cqw,15px); line-height:1.6; outline:none; scrollbar-color:var(--brown) var(--paper2); color:var(--ink)}
.cs-body>*{max-width:900px; margin-inline:auto}
.cs-tag{font:700 clamp(10px,1.6cqw,12px) var(--font-display); letter-spacing:.06em; text-transform:uppercase; color:var(--blue-d)}
.cs-body h2{font:700 clamp(20px,4.4cqw,34px)/1.1 var(--font-display); margin:4px auto 8px; text-wrap:balance; color:var(--brown-d)}
.cs-intro{color:var(--muted); margin-top:0; margin-bottom:14px; max-width:none}
.cs-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-bottom:8px}
.cs-stats div{padding:8px 10px}
.cs-stats b{display:block; font:700 clamp(18px,3.6cqw,28px) var(--font-display); color:var(--blue-d); font-variant-numeric:tabular-nums}
.cs-stats span{font-size:.85em; color:var(--muted)}
.cs-note{font-size:.8em; color:var(--muted); margin:4px auto 14px}
.cs-hero{margin:12px auto}
.cs-hero img,.cs-grid img{display:block; width:100%; height:auto; cursor:zoom-in; border:3px solid var(--brown); border-radius:8px; background:#fff; box-shadow:0 3px 0 var(--brown-d)}
.cs-hero img:hover,.cs-grid img:hover{border-color:var(--blue-d)}
.cs-meta{display:flex; flex-wrap:wrap; gap:6px; margin:10px auto}
.cs-meta span{padding:2px 10px; font:700 .78em var(--font-display); letter-spacing:.03em; background:var(--blue-l); border:2px solid #a9cde8; border-radius:999px; color:var(--blue-d)}
.cs-facts{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:10px auto 18px; padding:10px 14px}
.cs-facts dt{color:var(--muted); font-size:.85em}
.cs-facts dd{margin:0}
.cs-sec{margin:22px auto 0; padding-top:14px; border-top:3px dashed var(--paper3)}
.cs-sec .hd{display:flex; align-items:center; gap:10px}
.cs-sec .hd i{display:grid; place-items:center; min-width:26px; height:26px; border-radius:50%; background:var(--gold); border:2px solid var(--gold-d); color:var(--brown-d); font:700 12px var(--font-display); font-style:normal}
.cs-sec h3{font:700 clamp(15px,2.6cqw,21px)/1.2 var(--font-display); margin:0; color:var(--brown-d)}
.cs-sec p{margin:6px 0 10px; color:var(--ink); max-width:none}
.cs-grid{column-gap:12px}
.cs-grid figure{break-inside:avoid; margin:0 0 14px}
.cs-grid figcaption{font-size:.8em; color:var(--muted); margin-top:4px}
.cs-grid.n1{max-width:520px; margin-inline:0}
.cs-list{margin:10px auto 0; padding-left:20px}
@container (max-width:560px){ .cs-grid{column-count:2 !important} .cs-grid.n1{column-count:1 !important} }

/* điều khiển cảm ứng: cần trái/phải to, nút chạy bật tắt, nút tương tác tròn */
.pad{display:none; align-items:center; justify-content:space-between; gap:10px; touch-action:none; margin:0 6px; user-select:none; -webkit-user-select:none}
@media (pointer:coarse),(hover:none),(max-width:700px){.pad{display:flex} .desk{display:none}}
.pad .lr{display:flex; gap:10px}
.pad button{font:700 22px var(--font-display); color:var(--brown-d); background:var(--paper); border:3px solid var(--brown); border-radius:16px; box-shadow:inset 0 0 0 2px var(--paper2), 0 4px 0 var(--brown-d); touch-action:none; user-select:none; -webkit-user-select:none}
.pad .lr button{width:78px; height:64px}
.pad .lr button:active,.pad .lr button.on{background:var(--blue-l); transform:translateY(3px); box-shadow:inset 0 0 0 2px #fff, 0 1px 0 var(--brown-d)}
.pad .mid{display:flex; flex-direction:column; align-items:center; gap:4px; font:700 11px var(--font-display); color:var(--muted)}
.pad .run{width:64px; height:48px; font-size:13px; letter-spacing:.03em; border-radius:999px}
.pad .run.on{background:var(--gold); border-color:var(--gold-d); color:var(--brown-d); box-shadow:inset 0 3px 0 #ffe29a, 0 4px 0 var(--gold-d)}
.pad .act{width:78px; height:78px; border-radius:50%; background:var(--green); color:#fff; border-color:var(--green-d); text-shadow:0 2px 0 var(--green-d); font-size:12px; line-height:1.15; box-shadow:inset 0 4px 0 #9be6c7, 0 5px 0 var(--green-d)}
.pad .act:active{transform:translateY(3px)}
.iconbtn{width:32px; height:32px; border-radius:50%; border:3px solid var(--brown); background:var(--paper); color:var(--brown-d); font:700 16px/1 var(--font-display); cursor:pointer; box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d); padding:0}
.iconbtn:active{transform:translateY(2px)}
.menu{position:absolute; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr); background:var(--paper); z-index:5}
.menu-body{overflow:auto; padding:clamp(14px,3.4cqw,30px); max-width:640px; width:100%; margin-inline:auto; font-size:clamp(12px,2cqw,15px); line-height:1.6; outline:none}
.menu-body h2{font:700 clamp(18px,4cqw,28px)/1.15 var(--font-display); margin:0; color:var(--brown-d)}
.menu-body h3{font:700 clamp(13px,2.4cqw,17px) var(--font-display); margin:16px 0 4px; color:var(--blue-d)}
.menu-role{margin:2px 0 10px; color:var(--muted)}
.menu-note{color:var(--muted); font-size:.85em}
.menu-keys{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0}
.menu-keys dt{font-weight:700; color:var(--brown-d)} .menu-keys dd{margin:0}
.menu-body kbd{font:700 .85em var(--font-display); background:#fff; border:2px solid var(--brown); border-radius:5px; padding:0 5px; color:var(--brown-d)}
.set{display:grid; grid-template-columns:minmax(90px,150px) 1fr 3.2em; align-items:center; gap:10px; margin:12px 0}
.set label{font-weight:700; color:var(--brown-d)} .set output{font:700 .9em var(--font-display); color:var(--blue-d); text-align:right}
.set input[type=range]{width:100%; accent-color:var(--blue-d); height:28px}
.chk{display:flex; align-items:center; gap:8px; margin:12px 0; font-weight:600; color:var(--brown-d)}
.chk input{width:20px; height:20px; accent-color:var(--green-d)}
.menu-btns{margin:14px 0}
.btn.small{font-size:13px; padding:6px 18px}
.hint{margin:0 6px; color:var(--muted); font-size:12px; text-align:center}
.hint kbd{font:700 11px var(--font-display); background:var(--paper); border:2px solid var(--brown); border-radius:5px; padding:0 5px; color:var(--brown-d)}
.mg{position:absolute; inset:0; background:#000; z-index:20} .mg[hidden]{display:none}
.mg canvas{width:100%; height:100%; aspect-ratio:auto; touch-action:none; cursor:pointer}
.mg .lb-x{position:absolute; right:8px; top:8px}
.ask{position:absolute; left:10px; right:10px; bottom:10px; z-index:15; padding:18px 14px 10px; background:var(--paper); border:3px solid var(--brown); border-radius:12px; box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d); font-size:clamp(12px,2.1cqw,16px); color:var(--ink)}
.ask[hidden],.toast[hidden]{display:none}
.ask::before{content:"Mini-game"; position:absolute; left:12px; top:-3px; transform:translateY(-50%); font:700 .8em var(--font-display); color:#fff; background:var(--gold); border:3px solid var(--gold-d); border-radius:999px; padding:0 12px; letter-spacing:.04em; text-shadow:0 1px 0 var(--gold-d)}
.ask p{margin:0 0 10px} .askb{display:flex; gap:10px; justify-content:flex-end}
.btn.ghost{background:var(--paper); color:var(--brown-d); text-shadow:none; border-color:var(--brown); box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d)}
.toast{position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:30; max-width:90%; text-align:center; font:700 clamp(11px,2.1cqw,15px) var(--font-display); color:var(--brown-d); background:var(--gold); border:3px solid var(--gold-d); border-radius:999px; padding:5px 16px; box-shadow:0 3px 0 var(--gold-d)}
.toast.show{animation:tin .35s ease-out}
@keyframes tin{from{transform:translate(-50%,-14px); opacity:0} to{transform:translate(-50%,0); opacity:1}}
.stats .bdgBtn{display:flex; align-items:center; gap:7px; padding:3px 12px 3px 4px; border-radius:999px; font:inherit; color:var(--brown); background:var(--paper); border:3px solid var(--brown); box-shadow:inset 0 0 0 2px var(--paper2), 0 3px 0 var(--brown-d); cursor:pointer}

function musNote(f,dur,type,vol,t){ const c=AU.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(AU.mus); o.start(t); o.stop(t+dur+.03); }
